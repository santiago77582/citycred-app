# Staging seguro para la API oficial de WhatsApp de CityCred.
# No conecta Meta ni el número 7121. Las credenciales de Meta se cargan
# únicamente después de aprobar staging y elegir coexistencia o migración.

databases:
  - name: citycred-whatsapp-staging-db
    databaseName: citycred_whatsapp_staging
    user: citycred_staging
    plan: free

services:
  - type: web
    name: citycred-whatsapp-api-staging
    runtime: docker
    plan: free
    branch: main
    rootDir: whatsapp-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citycred-whatsapp-staging-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: API_KEY
        generateValue: true
      - key: FLOW_ENDPOINT_ENABLED
        value: 'false'
      - key: CAMPAIGN_EXECUTION_ENABLED
        value: 'false'
      - key: OPERATIONS_SCHEDULER_ENABLED
        value: 'false'
      - key: BACKUP_SCHEDULER_ENABLED
        value: 'false'
      - key: BACKUP_RESTORE_TEST_ENABLED
        value: 'false'
