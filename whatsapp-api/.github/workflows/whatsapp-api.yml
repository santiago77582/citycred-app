name: WhatsApp API checks

on:
  push:
    paths:
      - 'whatsapp-api/**'
  pull_request:
    paths:
      - 'whatsapp-api/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
