# Blueprint alternativo para crear únicamente un staging aislado desde este subdirectorio.
# No incluye credenciales de Meta y nunca despliega automáticamente desde main.
databases:
  - name: citycred-whatsapp-staging-standalone-db
    databaseName: citycred_whatsapp_staging_standalone
    user: citycred_staging_standalone
    plan: free

services:
  - type: web
    name: citycred-whatsapp-api-staging-standalone
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citycred-whatsapp-staging-standalone-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: 'false'
      - key: API_KEY
        generateValue: true
      - key: FLOW_ENDPOINT_ENABLED
        value: 'false'
      - key: CAMPAIGN_EXECUTION_ENABLED
        value: 'false'
      - key: OPERATIONS_SCHEDULER_ENABLED
        value: 'false'
      - key: BACKUP_SCHEDULER_ENABLED
        value: 'false'
      - key: BACKUP_RESTORE_TEST_ENABLED
        value: 'false'
