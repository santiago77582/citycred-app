databases:
  - name: citycred-whatsapp-db
    databaseName: citycred_whatsapp
    user: citycred
    plan: free

services:
  - type: web
    name: citycred-whatsapp-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citycred-whatsapp-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: 'false'
      - key: API_KEY
        generateValue: true
      - key: META_GRAPH_VERSION
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
