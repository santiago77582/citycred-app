name: Build GastoControl Pro V3 APK

on:
  push:
    branches:
      - gasto-control-android
    paths:
      - '.build/gastocontrol-v3overlay.part*'
      - '.github/workflows/build-gasto-control.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore V2 base
        run: |
          rm -rf gasto-control
          mkdir -p gasto-control
          cat .build/gastocontrol-v2.part* | base64 -d > /tmp/gastocontrol-pro-v2.zip
          unzip -q /tmp/gastocontrol-pro-v2.zip -d gasto-control

      - name: Overlay V3 files
        run: |
          cat .build/gastocontrol-v3overlay.part* | base64 -d > /tmp/gastocontrol-v3-overlay.tar.xz
          tar -xJf /tmp/gastocontrol-v3-overlay.tar.xz -C gasto-control

      - name: Build debug APK
        working-directory: gasto-control
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s gasto-control/app/build/outputs/apk/debug/app-debug.apk
          unzip -t gasto-control/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum gasto-control/app/build/outputs/apk/debug/app-debug.apk
          ls -lh gasto-control/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v3-apk
          path: gasto-control/app/build/outputs/apk/debug/app-debug.apk
