name: Build GastoControl Pro V6 APK

on:
  push:
    branches:
      - gasto-control-android
    paths:
      - '.build/gastocontrol-v6overlay.part*'
      - '.github/workflows/build-gasto-control.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore complete V3 project
        run: |
          rm -rf gasto-control
          mkdir -p gasto-control
          cat .build/gastocontrol-v3full.part* | base64 -d > /tmp/gastocontrol-v3full.tar.xz
          tar -xJf /tmp/gastocontrol-v3full.tar.xz -C gasto-control

      - name: Apply simple V4 interface
        run: |
          cat .build/gastocontrol-v4overlay.part* | base64 -d > /tmp/gastocontrol-v4-overlay.tar.xz
          tar -xJf /tmp/gastocontrol-v4-overlay.tar.xz -C gasto-control

      - name: Apply V5 always-on monitor
        run: |
          cat .build/gastocontrol-v5overlay.part* | base64 -d > /tmp/gastocontrol-v5-overlay.tar.xz
          tar -xJf /tmp/gastocontrol-v5-overlay.tar.xz -C gasto-control
          test -f gasto-control/app/src/main/java/com/gastocontrol/app/ListenerWatchdog.java

      - name: Apply V6 app catalog
        run: |
          cat .build/gastocontrol-v6overlay.part00fixed .build/gastocontrol-v6overlay.part01 .build/gastocontrol-v6overlay.part02 .build/gastocontrol-v6overlay.part03 .build/gastocontrol-v6overlay.part04 | base64 -d > /tmp/gastocontrol-v6-overlay.tar.xz
          xz -t /tmp/gastocontrol-v6-overlay.tar.xz
          tar -xJf /tmp/gastocontrol-v6-overlay.tar.xz -C gasto-control
          test -f gasto-control/app/src/main/java/com/gastocontrol/app/AppMonitorRegistry.java
          test -f gasto-control/app/src/main/java/com/gastocontrol/app/AppSelectionActivity.java
          grep -q 'versionName "6.0.0"' gasto-control/app/build.gradle
          grep -q 'Apps que quiero controlar' gasto-control/app/src/main/java/com/gastocontrol/app/MainActivity.java

      - name: Build debug APK
        working-directory: gasto-control
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s gasto-control/app/build/outputs/apk/debug/app-debug.apk
          unzip -t gasto-control/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum gasto-control/app/build/outputs/apk/debug/app-debug.apk
          ls -lh gasto-control/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v6-apk
          path: gasto-control/app/build/outputs/apk/debug/app-debug.apk
