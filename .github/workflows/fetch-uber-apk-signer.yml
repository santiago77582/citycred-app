name: Fetch Uber APK Signer

on:
  push:
    branches:
      - gasto-control-v12-release
    paths:
      - '.github/workflows/fetch-uber-apk-signer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download signer
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          sha256sum uber-apk-signer-1.3.0.jar
          test -s uber-apk-signer-1.3.0.jar
      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: uber-apk-signer-1.3.0.jar
