name: WhatsApp API

on:
  push:
    branches:
      - main
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'
  pull_request:
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'

permissions:
  contents: read

concurrency:
  group: whatsapp-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: whatsapp-api/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test > test-output.log 2>&1
      - name: Guardar diagnóstico de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-api-test-output
          path: whatsapp-api/test-output.log
          retention-days: 7
          if-no-files-found: error
      - name: TypeScript
        run: npm run typecheck > typecheck-output.log 2>&1
      - name: Guardar diagnóstico de TypeScript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-api-typecheck-output
          path: whatsapp-api/typecheck-output.log
          retention-days: 7
          if-no-files-found: error
      - run: npm run build
      - run: npm audit --omit=dev
