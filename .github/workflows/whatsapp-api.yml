name: WhatsApp API

on:
  push:
    branches:
      - main
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'
  pull_request:
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'

permissions:
  contents: read

concurrency:
  group: whatsapp-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: whatsapp-api/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test > test-output.log 2>&1
      - name: Guardar diagnóstico de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-api-test-output
          path: whatsapp-api/test-output.log
          retention-days: 7
          if-no-files-found: error
      - name: TypeScript
        run: npm run typecheck > typecheck-output.log 2>&1
      - name: Guardar diagnóstico de TypeScript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-api-typecheck-output
          path: whatsapp-api/typecheck-output.log
          retention-days: 7
          if-no-files-found: error
      - run: npm run build
      - run: npm audit --omit=dev

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citycred_ci
          POSTGRES_DB: citycred_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citycred_ci -d citycred_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Crear clave efímera para el contenedor
        run: echo "CI_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Construir imagen Docker sin publicarla
        run: docker build --tag citycred-whatsapp-api:ci whatsapp-api
      - name: Arrancar contenedor aislado
        run: >-
          docker run --detach --name citycred-api-smoke --network host
          --env NODE_ENV=production
          --env API_KEY="$CI_API_KEY"
          --env DATABASE_URL=postgresql://citycred_ci@127.0.0.1:5432/citycred_ci
          --env DATABASE_SSL=false
          --env FLOW_ENDPOINT_ENABLED=false
          --env CAMPAIGN_EXECUTION_ENABLED=false
          --env OPERATIONS_SCHEDULER_ENABLED=false
          --env BACKUP_SCHEDULER_ENABLED=false
          --env BACKUP_RESTORE_TEST_ENABLED=false
          citycred-whatsapp-api:ci
      - name: Verificar arranque, migraciones y modo seguro
        run: |
          node <<'NODE'
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let response;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              response = await fetch('http://127.0.0.1:3000/health');
              if (response.ok) break;
            } catch {}
            await wait(2000);
          }
          if (!response?.ok) throw new Error('El contenedor no quedó saludable dentro de 60 segundos');
          const health = await response.json();
          if (health.database !== 'ok' || health.safety?.safeMode !== true) {
            throw new Error(`Health inseguro: ${JSON.stringify(health)}`);
          }
          if (!Object.values(health.safety.features).every(value => value === false)) {
            throw new Error(`Se activó una función peligrosa: ${JSON.stringify(health.safety.features)}`);
          }
          NODE
      - name: Guardar logs del contenedor
        if: always()
        run: docker logs citycred-api-smoke > container-smoke.log 2>&1 || true
      - name: Subir diagnóstico del contenedor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-api-container-smoke
          path: container-smoke.log
          retention-days: 7
          if-no-files-found: error
      - name: Detener contenedor
        if: always()
        run: docker stop citycred-api-smoke || true
