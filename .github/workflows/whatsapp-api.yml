name: WhatsApp API

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'
  pull_request:
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'

permissions:
  contents: read

concurrency:
  group: whatsapp-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whatsapp-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
