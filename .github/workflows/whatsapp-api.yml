name: WhatsApp API

on:
  push:
    branches:
      - main
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'
  pull_request:
    paths:
      - 'whatsapp-api/**'
      - '.github/workflows/whatsapp-api.yml'

permissions:
  contents: read

concurrency:
  group: whatsapp-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whatsapp-api/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log
      - name: Guardar diagnóstico de TypeScript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostico
          path: whatsapp-api/typecheck.log
          retention-days: 1
      - run: npm run build
      - run: npm audit --omit=dev
