name: Build GastoControl Pro V10 APK

on:
  push:
    branches:
      - gasto-control-v10-release
    paths:
      - '.build/gastocontrol-v10full.part*'
      - '.github/workflows/build-gasto-control-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore V10 source
        run: |
          rm -rf gasto-control
          mkdir -p gasto-control
          cat .build/gastocontrol-v10full.part00 .build/gastocontrol-v10full.part01 .build/gastocontrol-v10full.part02 .build/gastocontrol-v10full.part03 .build/gastocontrol-v10full.part04 | base64 --decode --ignore-garbage > /tmp/gastocontrol-v10.tar.xz
          xz -t /tmp/gastocontrol-v10.tar.xz
          tar -xJf /tmp/gastocontrol-v10.tar.xz -C gasto-control
          grep -q 'versionName "10.0.0"' gasto-control/app/build.gradle
          test -f gasto-control/app/src/main/java/com/gastocontrol/app/FinanceNotificationService.java
          test -f gasto-control/app/src/test/java/com/gastocontrol/app/NotificationParserTest.java
      - name: Run unit tests
        working-directory: gasto-control
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: gasto-control
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s gasto-control/app/build/outputs/apk/debug/app-debug.apk
          unzip -t gasto-control/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum gasto-control/app/build/outputs/apk/debug/app-debug.apk
          ls -lh gasto-control/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v10-apk
          path: gasto-control/app/build/outputs/apk/debug/app-debug.apk
