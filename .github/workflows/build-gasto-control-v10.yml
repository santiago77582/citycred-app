name: Build GastoControl Pro V10 APK

on:
  push:
    branches:
      - gasto-control-v10-release
    paths:
      - '.build/v10patch.*'
      - '.github/workflows/build-gasto-control-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore V7 base
        run: |
          set -euxo pipefail
          rm -rf gasto-control
          mkdir -p gasto-control
          cat .build/gastocontrol-v3full.part* | base64 -d > /tmp/v3.tar.xz
          xz -t /tmp/v3.tar.xz
          tar -xJf /tmp/v3.tar.xz -C gasto-control
          cat .build/gastocontrol-v4overlay.part* | base64 -d > /tmp/v4.tar.xz
          xz -t /tmp/v4.tar.xz
          tar -xJf /tmp/v4.tar.xz -C gasto-control
          cat .build/gastocontrol-v5overlay.part* | base64 -d > /tmp/v5.tar.xz
          xz -t /tmp/v5.tar.xz
          tar -xJf /tmp/v5.tar.xz -C gasto-control
          cat .build/gastocontrol-v6overlay.part00fixed .build/gastocontrol-v6overlay.fixed01 .build/gastocontrol-v6overlay.fixed02 .build/gastocontrol-v6overlay.fixed03 > /tmp/v6.b64
          cat >> /tmp/v6.b64 <<'V6TAIL'
          
          V6TAIL
          tr -d '[:space:]' < /tmp/v6.b64 | base64 -d > /tmp/v6.tar.xz
          xz -t /tmp/v6.tar.xz
          tar -xJf /tmp/v6.tar.xz -C gasto-control
          base64 -d .build/gastocontrol-v7overlay.b64 > /tmp/v7.tar.xz
          xz -t /tmp/v7.tar.xz
          tar -xJf /tmp/v7.tar.xz -C gasto-control
          grep -n 'versionName' gasto-control/app/build.gradle

      - name: Apply V10 patch
        run: |
          set -uxo pipefail
          sha256sum .build/v10patch.*
          cat .build/v10patch.00 .build/v10patch.01 .build/v10patch.02 .build/v10patch.03 .build/v10patch.04 | base64 -d > /tmp/v10.patch.xz
          echo "decode=$?"
          xz -t /tmp/v10.patch.xz
          echo "xztest=$?"
          xz -dc /tmp/v10.patch.xz > /tmp/v10.patch
          echo "unxz=$?"
          cd gasto-control
          git apply --check --verbose /tmp/v10.patch
          echo "applycheck=$?"
          git apply --verbose --whitespace=nowarn /tmp/v10.patch
          echo "apply=$?"
          grep -n 'versionName' app/build.gradle || true
          ls -l app/src/main/java/com/gastocontrol/app/ProviderNotificationParser.java app/src/main/java/com/gastocontrol/app/PdfStatementImporter.java app/src/test/java/com/gastocontrol/app/NotificationParserTest.java || true
          test -f app/src/main/java/com/gastocontrol/app/ProviderNotificationParser.java
          test -f app/src/main/java/com/gastocontrol/app/PdfStatementImporter.java
          test -f app/src/test/java/com/gastocontrol/app/NotificationParserTest.java

      - name: Run unit tests
        working-directory: gasto-control
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: gasto-control
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s gasto-control/app/build/outputs/apk/debug/app-debug.apk
          unzip -t gasto-control/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum gasto-control/app/build/outputs/apk/debug/app-debug.apk
          ls -lh gasto-control/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v10-apk
          path: gasto-control/app/build/outputs/apk/debug/app-debug.apk
