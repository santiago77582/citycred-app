name: Build GastoControl Pro V11 APK

on:
  push:
    branches:
      - gasto-control-v10-release
    paths:
      - '.build/gastocontrol-v11overlay.part*'
      - '.github/workflows/build-gasto-control-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct tested V10 source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-gasto-control-v10.yml').read_text(encoding='utf-8')

          def extract(step_name, target):
              marker = f"      - name: {step_name}\n        run: |\n"
              if marker not in text:
                  raise SystemExit(f'No se encontro paso: {step_name}')
              body = text.split(marker, 1)[1]
              body = body.split('\n      - name:', 1)[0]
              out = []
              for line in body.splitlines():
                  out.append(line[10:] if line.startswith('          ') else line)
              Path(target).write_text('\n'.join(out) + '\n', encoding='utf-8')

          extract('Restore V7 base', '/tmp/restore-v10-base.sh')
          extract('Apply V10 patch', '/tmp/apply-v10.sh')
          PY
          bash /tmp/restore-v10-base.sh
          bash /tmp/apply-v10.sh
          grep -q 'versionName "10.0.0"' gasto-control/app/build.gradle

      - name: Apply V11 automatic-first UI
        run: |
          set -euxo pipefail
          cat .build/gastocontrol-v11overlay.part00 .build/gastocontrol-v11overlay.part01 | base64 -d > /tmp/v11.tar.xz
          xz -t /tmp/v11.tar.xz
          tar -xJf /tmp/v11.tar.xz -C gasto-control
          grep -q 'versionName "11.0.0"' gasto-control/app/build.gradle
          grep -q 'capture_expenses_only' gasto-control/app/src/main/java/com/gastocontrol/app/MainActivity.java
          grep -q 'autoEnableInstalledFinancialApps' gasto-control/app/src/main/java/com/gastocontrol/app/AppMonitorRegistry.java

      - name: Run unit tests
        working-directory: gasto-control
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: gasto-control
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s gasto-control/app/build/outputs/apk/debug/app-debug.apk
          unzip -t gasto-control/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum gasto-control/app/build/outputs/apk/debug/app-debug.apk
          ls -lh gasto-control/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v11-apk
          path: gasto-control/app/build/outputs/apk/debug/app-debug.apk
