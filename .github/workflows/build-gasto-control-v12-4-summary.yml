name: Build GastoControl Pro V12.4 Summary

on:
  push:
    branches:
      - gasto-control-v12-release
    paths:
      - '.build/gcv124x.*'
      - '.github/workflows/build-gasto-control-v12-4-summary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct V12.3 source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-gasto-control-v12-3-auto.yml').read_text(encoding='utf-8')
          def extract(step_name, target):
              marker = f"      - name: {step_name}\n        run: |\n"
              if marker not in text:
                  raise SystemExit('No se encontro '+step_name)
              body = text.split(marker,1)[1].split('\n      - name:',1)[0]
              out=[]
              for line in body.splitlines():
                  out.append(line[10:] if line.startswith('          ') else line)
              Path(target).write_text('\n'.join(out)+'\n', encoding='utf-8')
          extract('Reconstruct V12.2 source','/tmp/reconstruct-v122.sh')
          extract('Apply V12.3 automatic history reader','/tmp/apply-v123.sh')
          PY
          bash /tmp/reconstruct-v122.sh
          bash /tmp/apply-v123.sh
          grep -q 'versionCode 15' gasto-control/app/build.gradle
          grep -q 'versionName "12.3.0"' gasto-control/app/build.gradle

      - name: Apply V12.4 floating finish and session summary
        run: |
          set -euxo pipefail
          cat .build/gcv124x.00 \
              .build/gcv124x.01 \
              .build/gcv124x.02 \
              .build/gcv124x.03 \
              .build/gcv124x.04 \
              .build/gcv124x.05 > /tmp/v124.b64
          base64 -d /tmp/v124.b64 > /tmp/v124.tar.xz
          echo '685231522fa82d150fea98f18d687d1ae816abe7e5755ba12a8fc1f2d9cc45d4  /tmp/v124.tar.xz' | sha256sum -c -
          xz -t /tmp/v124.tar.xz
          tar -xJf /tmp/v124.tar.xz -C gasto-control
          grep -q 'versionCode 16' gasto-control/app/build.gradle
          grep -q 'versionName "12.4.0"' gasto-control/app/build.gradle
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' gasto-control/app/src/main/AndroidManifest.xml
          grep -q 'EXTRA_SESSION_ID' gasto-control/app/src/main/java/com/gastocontrol/app/ScreenCaptureService.java
          grep -q 'showCaptureSummary' gasto-control/app/src/main/java/com/gastocontrol/app/MainActivity.java
          grep -q 'transactionsByTag' gasto-control/app/src/main/java/com/gastocontrol/app/ExpenseDbHelper.java
          grep -q 'TERMINAR' gasto-control/app/src/main/java/com/gastocontrol/app/ScreenCaptureService.java

      - name: Run unit tests
        working-directory: gasto-control
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        working-directory: gasto-control
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned APK
        run: |
          set -euxo pipefail
          APK=gasto-control/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v12.4-unsigned-apk
          path: gasto-control/app/build/outputs/apk/release/app-release-unsigned.apk
