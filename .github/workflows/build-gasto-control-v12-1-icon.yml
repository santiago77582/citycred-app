name: Build GastoControl Pro V12.1 Icon Update

on:
  push:
    branches:
      - gasto-control-v12-release
    paths:
      - '.build/ic_launcher_piggy.webp.b64'
      - '.github/workflows/build-gasto-control-v12-1-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct V12 source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-gasto-control-v12.yml').read_text(encoding='utf-8')
          def extract(step_name, target):
              marker = f"      - name: {step_name}\n        run: |\n"
              body = text.split(marker, 1)[1].split('\n      - name:', 1)[0]
              out=[]
              for line in body.splitlines(): out.append(line[10:] if line.startswith('          ') else line)
              Path(target).write_text('\n'.join(out)+'\n', encoding='utf-8')
          extract('Reconstruct V11 source','/tmp/reconstruct-v11.sh')
          extract('Apply V12 guided capture','/tmp/apply-v12.sh')
          PY
          bash /tmp/reconstruct-v11.sh
          bash /tmp/apply-v12.sh

      - name: Make stable updateable V12.1 with new icon
        run: |
          set -euxo pipefail
          cat > gasto-control/app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gastocontrol.app'
              compileSdk 35

              def gcKeystore = System.getenv("GASTOCONTROL_KEYSTORE")
              def gcStorePass = System.getenv("GASTOCONTROL_STORE_PASSWORD")
              def gcKeyAlias = System.getenv("GASTOCONTROL_KEY_ALIAS") ?: "gastocontrol"
              def gcKeyPass = System.getenv("GASTOCONTROL_KEY_PASSWORD") ?: gcStorePass

              signingConfigs {
                  stableRelease {
                      if (gcKeystore && gcStorePass) {
                          storeFile file(gcKeystore)
                          storePassword gcStorePass
                          keyAlias gcKeyAlias
                          keyPassword gcKeyPass
                          v1SigningEnabled true
                          v2SigningEnabled true
                      }
                  }
              }

              defaultConfig {
                  applicationId "com.gastocontrol.app.v12"
                  minSdk 26
                  targetSdk 35
                  versionCode 13
                  versionName "12.1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      if (gcKeystore && gcStorePass) {
                          signingConfig signingConfigs.stableRelease
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              testImplementation 'junit:junit:4.13.2'
          }
          GRADLE

          mkdir -p gasto-control/app/src/main/res/drawable-nodpi
          base64 -d .build/ic_launcher_piggy.webp.b64 > gasto-control/app/src/main/res/drawable-nodpi/ic_launcher_piggy.webp
          sed -i 's#android:icon="@drawable/ic_gastocontrol"#android:icon="@drawable/ic_launcher_piggy"#' gasto-control/app/src/main/AndroidManifest.xml
          grep -q 'applicationId "com.gastocontrol.app.v12"' gasto-control/app/build.gradle
          grep -q 'versionCode 13' gasto-control/app/build.gradle
          grep -q 'versionName "12.1.0"' gasto-control/app/build.gradle
          grep -q 'android:icon="@drawable/ic_launcher_piggy"' gasto-control/app/src/main/AndroidManifest.xml

      - name: Run unit tests
        working-directory: gasto-control
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        working-directory: gasto-control
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned APK
        run: |
          set -euxo pipefail
          APK=gasto-control/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastoControl-Pro-v12.1-unsigned-apk
          path: gasto-control/app/build/outputs/apk/release/app-release-unsigned.apk
