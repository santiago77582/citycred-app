name: Build Mamadera 3h Azul APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate and customize Mamadera
        shell: bash
        run: |
          curl -L --fail "https://raw.githubusercontent.com/santiago77582/citycred-app/3d0ab670ee4760d13f321ac795f46f521e2dc056/.github/workflows/build-mamadera3h.yml" -o /tmp/original.yml
          mkdir -p mamadera
          sed -n "/<<'B64EOF'/,/^[[:space:]]*B64EOF[[:space:]]*$/p" /tmp/original.yml \
            | sed '1d;$d;s/^[[:space:]]*//' \
            | base64 -d > /tmp/mamadera.zip
          unzip -q /tmp/mamadera.zip -d mamadera
          sed -i 's/#FFFFFF/#3B82F6/g' mamadera/app/src/main/res/drawable/ic_bottle_clock.xml
          sed -i 's/versionCode = 1/versionCode = 2/' mamadera/app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "1.1"/' mamadera/app/build.gradle.kts
      - name: Build APK
        run: gradle -p mamadera --no-daemon assembleDebug
      - name: Rename APK
        run: cp mamadera/app/build/outputs/apk/debug/app-debug.apk Mamadera3h_Azul_v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mamadera3h-Azul-v2
          path: Mamadera3h_Azul_v2.apk
          if-no-files-found: error
