# Producción para la API oficial de WhatsApp de CityCred.
# Crea recursos separados del staging y no contiene credenciales.

databases:
  - name: citycred-whatsapp-production-db
    databaseName: citycred_whatsapp_production
    user: citycred_production
    plan: basic-256mb
    diskSizeGB: 15
    region: oregon

services:
  - type: web
    name: citycred-whatsapp-api-production
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: whatsapp-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citycred-whatsapp-production-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: API_KEY
        generateValue: true
